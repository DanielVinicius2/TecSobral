spring.application.name=estoque

# CONEXAO SUPABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Origens permitidas para o frontend local e a implantação atual do Vercel
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://tec-sobral-git-branchfinal-sominozes.vercel.app}

# SERVIDOR
server.port=${PORT:8080}


#LOCAL
    #spring.datasource.username=postgres
    #spring.datasource.password=${DB_SENHA}

spring.flyway.enabled=false

# Caminhos dos utilitários PostgreSQL (sobrescreva por ambiente em outras máquinas)
app.backup.pg-dump=${APP_BACKUP_PG_DUMP:C:/Program Files/PostgreSQL/18/bin/pg_dump.exe}
app.backup.pg-restore=${APP_BACKUP_PG_RESTORE:C:/Program Files/PostgreSQL/18/bin/pg_restore.exe}